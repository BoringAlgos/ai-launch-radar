<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Launch Radar</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --amber: #d29922;
    --blue: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 20px 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .controls {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls input[type="search"], .controls select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }
  .controls input[type="search"] { flex: 1 1 220px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .chip.active { border-color: var(--accent); color: var(--accent); }
  #grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 20px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card h2 { margin: 0; font-size: 1.05rem; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .summary { color: var(--muted); font-size: 0.88rem; margin: 0; }
  .usp {
    font-size: 0.85rem;
    border-left: 2px solid var(--green);
    padding-left: 10px;
    color: var(--text);
  }
  .usp span { color: var(--muted); font-size: 0.75rem; display: block; text-transform: uppercase; letter-spacing: 0.04em; }
  .idea {
    font-size: 0.85rem;
    border-left: 2px solid var(--accent);
    padding-left: 10px;
    color: var(--text);
  }
  .idea span { color: var(--muted); font-size: 0.75rem; display: block; text-transform: uppercase; letter-spacing: 0.04em; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: auto;
  }
  .badge {
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.72rem;
    font-weight: 600;
  }
  .badge.idea { background: #1f6feb33; color: #79c0ff; }
  .badge.approved { background: #9e6a0333; color: #e3b341; }
  .badge.building { background: #8957e533; color: #d2a8ff; }
  .badge.shipped { background: #23863633; color: #7ee787; }
  .badge.trending { background: #f778ba33; color: #ff9ece; }
  .badge.launch { background: #1f6feb33; color: #79c0ff; }
  .tag.hot { border-color: var(--amber); color: #e3b341; }
  .repo { color: var(--accent); text-decoration: none; }
  .score { display: flex; align-items: center; gap: 6px; }
  .score-bar { width: 64px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .score-bar i { display: block; height: 100%; background: var(--green); }
  .tag { border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; font-size: 0.72rem; }
  a.ext { color: var(--muted); }
  #empty { color: var(--muted); text-align: center; padding: 40px; grid-column: 1 / -1; }
  .card { cursor: pointer; transition: border-color 0.15s; }
  .card:hover { border-color: var(--accent); }
  .details-hint { font-size: 0.75rem; color: var(--muted); }
  #modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 100; overflow-y: auto;
  }
  #modal-backdrop[hidden] { display: none; }
  #modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    max-width: 640px; width: 100%;
    padding: 24px;
    position: relative;
  }
  #modal h2 { margin: 0 32px 0 0; font-size: 1.3rem; }
  #modal-close {
    position: absolute; top: 12px; right: 12px;
    background: none; border: none; color: var(--muted);
    font-size: 1.4rem; cursor: pointer; line-height: 1;
  }
  #modal-close:hover { color: var(--text); }
  .modal-sec { font-size: 0.9rem; }
  .modal-sec > span {
    color: var(--muted); font-size: 0.72rem; display: block;
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;
  }
  .build { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .build a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.88rem; }
  .build p { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); }
  .build .src { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
<header>
  <h1>AI Launch Radar</h1>
  <p id="updated">Loading...</p>
</header>

<div class="controls">
  <input type="search" id="q" placeholder="Search launches, repos, ideas...">
  <select id="sort">
    <option value="jev">Sort: JEV score</option>
    <option value="stars">Sort: GitHub stars</option>
    <option value="newest">Sort: Newest</option>
  </select>
</div>
<div class="controls">
  <div class="chips" id="viewTabs">
    <button class="chip active" data-view="live">Live</button>
    <button class="chip" data-view="archive">Archive</button>
  </div>
  <div class="chips" id="statusChips">
    <button class="chip active" data-status="">All</button>
    <button class="chip" data-status="idea">Idea</button>
    <button class="chip" data-status="approved">Approved</button>
    <button class="chip" data-status="building">Building</button>
    <button class="chip" data-status="shipped">Shipped</button>
  </div>
</div>

<div class="controls">
  <div class="chips" id="catChips">
    <button class="chip active" data-cat="">All categories</button>
    <button class="chip" data-cat="models">Models</button>
    <button class="chip" data-cat="agents">Agents</button>
    <button class="chip" data-cat="coding">Coding</button>
    <button class="chip" data-cat="infra">Infra</button>
    <button class="chip" data-cat="media">Media</button>
    <button class="chip" data-cat="robotics">Robotics</button>
    <button class="chip" data-cat="security">Security</button>
  </div>
</div>

<div class="controls">
  <div class="chips" id="subcatChips" hidden>
    <button class="chip active" data-subcat="">All</button>
  </div>
</div>

<div id="grid"></div>

<div id="modal-backdrop" hidden>
  <div id="modal" role="dialog" aria-modal="true">
    <button id="modal-close" aria-label="Close">&times;</button>
    <div id="modal-body" style="display:flex;flex-direction:column;gap:12px;"></div>
  </div>
</div>

<script>
const FALLBACK = "https://raw.githubusercontent.com/BoringAlgos/ai-launch-radar/main/data/";
let launches = [];
let archive = [];
let statusFilter = "";
let categoryFilter = "";
let subcategoryFilter = "";
let view = "live";

const SUBCATS = {
  models: ["frontier", "open-weights", "on-device", "decision", "composite"],
  agents: ["frameworks", "orchestration", "assistants"],
  coding: ["ide", "gateway"],
  infra: ["tokenizer", "router", "memory"],
  media: ["image", "3d"],
  robotics: ["ros"],
  security: ["identity", "compliance"]
};

async function fetchJson(name) {
  let res;
  try {
    res = await fetch("data/" + name);
    if (!res.ok) throw new Error("relative fetch failed");
  } catch (e) {
    res = await fetch(FALLBACK + name);
  }
  return res.json();
}

async function load() {
  const [live, arch] = await Promise.all([
    fetchJson("launches.json"),
    fetchJson("archive.json").catch(() => ({ launches: [] }))
  ]);
  launches = live.launches || [];
  archive = arch.launches || [];
  document.getElementById("updated").textContent =
    "Last updated: " + (live.updated_at || "unknown") + "  ·  " +
    launches.length + " live  ·  " + archive.length + " archived";
  render();
}

function scoreBar(s) {
  const pct = Math.round((s || 0) * 100);
  return '<span class="score"><span class="score-bar"><i style="width:' + pct + '%"></i></span>' + pct + '</span>';
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  const sort = document.getElementById("sort").value;
  const pool = view === "archive" ? archive : launches;
  let items = pool.filter(l => {
    if (statusFilter && l.implementation_status !== statusFilter) return false;
    if (categoryFilter && (l.category || "") !== categoryFilter) return false;
    if (subcategoryFilter && (l.subcategory || "") !== subcategoryFilter) return false;
    if (!q) return true;
    return (l.title + " " + l.summary + " " + (l.usp || "") + " " + (l.github_repo || "") + " " +
            (l.implementation_idea || "") + " " + (l.tags || []).join(" ")).toLowerCase().includes(q);
  });
  items.sort((a, b) => {
    if (sort === "stars") return (b.github_stars || 0) - (a.github_stars || 0);
    if (sort === "newest") return (b.added_at || "") < (a.added_at || "") ? -1 : 1;
    return (b.jev_score || 0) - (a.jev_score || 0);
  });

  const grid = document.getElementById("grid");
  if (!items.length) {
    grid.innerHTML = '<div id="empty">No launches match.</div>';
    return;
  }
  grid.innerHTML = items.map(l => {
    const repo = l.github_repo
      ? '<a class="repo" href="https://github.com/' + l.github_repo + '" target="_blank" rel="noopener">' + l.github_repo + '</a>' +
        ' · ' + (l.github_stars || 0).toLocaleString() + ' stars'
      : "";
    const tags = (l.tags || []).map(t =>
      '<span class="tag' + ((t === "interesting" || t === "not-implemented") ? " hot" : "") +
      '">' + t + "</span>").join(" ");
    const kindBadge = l.kind === "trending"
      ? '<span class="badge trending">trending</span>'
      : '<span class="badge launch">new</span>';
    return '<div class="card" data-id="' + l.id + '">' +
      '<h2><a href="' + l.url + '" target="_blank" rel="noopener">' + l.title + "</a></h2>" +
      '<p class="summary">' + l.summary + "</p>" +
      '<div class="meta">' +
        kindBadge +
        '<span class="badge ' + l.implementation_status + '">' + l.implementation_status + "</span>" +
        '<span class="tag">' + (l.category || "misc") + (l.subcategory ? " · " + l.subcategory : "") + "</span>" +
        scoreBar(l.jev_score) +
        (repo ? "<span>" + repo + "</span>" : "") +
      "</div>" +
      '<div class="meta">' +
        "<span>via " + l.added_by + "</span>" +
        "<span>" + l.added_at + "</span>" +
        '<span class="details-hint">click for details &rarr;</span>' +
      "</div>" +
    "</div>";
  }).join("");
}

function openModal(id) {
  const pool = view === "archive" ? archive : launches;
  const l = pool.find(x => x.id === id);
  if (!l) return;
  const repo = l.github_repo
    ? '<a class="repo" href="https://github.com/' + l.github_repo + '" target="_blank" rel="noopener">' + l.github_repo + '</a>' +
      ' · ' + (l.github_stars || 0).toLocaleString() + ' stars'
    : "n/a";
  const kindBadge = l.kind === "trending"
    ? '<span class="badge trending">trending</span>'
    : '<span class="badge launch">new</span>';
  const tags = (l.tags || []).map(t =>
    '<span class="tag' + ((t === "interesting" || t === "not-implemented") ? " hot" : "") +
    '">' + t + "</span>").join(" ");
  const builds = (l.community_builds || []).map(b =>
    '<div class="build"><span class="src">' + (b.source || "web") + "</span><br>" +
    '<a href="' + b.url + '" target="_blank" rel="noopener">' + b.title + "</a>" +
    (b.summary ? "<p>" + b.summary + "</p>" : "") + "</div>").join("");
  const implRepos = (l.implementation_repos || []).map(r =>
    '<div class="build"><a href="https://github.com/' + r.repo + '" target="_blank" rel="noopener">' + r.repo + "</a>" +
    (r.stars ? ' <span class="src">' + r.stars.toLocaleString() + " stars</span>" : "") +
    (r.summary ? "<p>" + r.summary + "</p>" : "") + "</div>").join("");
  document.getElementById("modal-body").innerHTML =
    '<h2><a href="' + l.url + '" target="_blank" rel="noopener" style="color:var(--text);text-decoration:none;">' + l.title + "</a></h2>" +
    '<div class="meta">' + kindBadge +
      '<span class="badge ' + l.implementation_status + '">' + l.implementation_status + "</span>" +
      '<span class="tag">' + (l.category || "misc") + "</span>" +
      scoreBar(l.jev_score) + "</div>" +
    '<p class="summary">' + l.summary + "</p>" +
    (l.usp ? '<div class="usp"><span>Why it matters</span>' + l.usp + "</div>" : "") +
    (l.implementation_idea
      ? '<div class="modal-sec"><div class="idea"><span>Implementation idea</span>' + l.implementation_idea + "</div></div>"
      : "") +
    (l.learn_url
      ? '<div class="modal-sec"><span>Learn more</span><a class="repo" href="' + l.learn_url + '" target="_blank" rel="noopener">' +
        (l.learn_label || "deep dive") + " &rarr;</a></div>"
      : "") +
    '<div class="modal-sec"><span>Built with this</span>' +
      (builds || '<p class="summary">No community builds tracked yet.</p>') + "</div>" +
    (l.usability
      ? '<div class="modal-sec"><span>Usability verdict</span>' + l.usability + "</div>"
      : "") +
    ((l.implementation_repos || []).length
      ? '<div class="modal-sec"><span>Notable implementations on GitHub</span>' + implRepos + "</div>"
      : "") +
    '<div class="meta"><span>' + repo + "</span>" +
      '<a class="ext" href="' + l.source_url + '" target="_blank" rel="noopener">source</a>' +
      "<span>via " + l.added_by + " · " + l.added_at + "</span></div>" +
    '<div class="meta">' + tags + "</div>";
  document.getElementById("modal-backdrop").hidden = false;
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal-backdrop").hidden = true;
  document.body.style.overflow = "";
}

document.getElementById("grid").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const card = e.target.closest(".card");
  if (card && card.dataset.id) openModal(card.dataset.id);
});
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-backdrop").addEventListener("click", e => {
  if (e.target.id === "modal-backdrop") closeModal();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("modal-backdrop").hidden) closeModal();
});

document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("catChips").addEventListener("click", e => {
  if (e.target.dataset.cat === undefined) return;
  categoryFilter = e.target.dataset.cat;
  subcategoryFilter = "";
  document.querySelectorAll("#catChips .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  const sub = document.getElementById("subcatChips");
  if (categoryFilter && SUBCATS[categoryFilter]) {
    sub.hidden = false;
    sub.innerHTML = '<button class="chip active" data-subcat="">All</button>' +
      SUBCATS[categoryFilter].map(s =>
        '<button class="chip" data-subcat="' + s + '">' + s + "</button>").join("");
  } else {
    sub.hidden = true;
  }
  render();
});

document.getElementById("subcatChips").addEventListener("click", e => {
  if (e.target.dataset.subcat === undefined) return;
  subcategoryFilter = e.target.dataset.subcat;
  document.querySelectorAll("#subcatChips .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

document.getElementById("viewTabs").addEventListener("click", e => {
  if (e.target.dataset.view === undefined) return;
  view = e.target.dataset.view;
  document.querySelectorAll("#viewTabs .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

document.getElementById("statusChips").addEventListener("click", e => {
  if (e.target.dataset.status === undefined) return;
  statusFilter = e.target.dataset.status;
  document.querySelectorAll("#statusChips .chip").forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");
  render();
});

load();
</script>
</body>
</html>
