<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Fresh Weights</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table,td,div,p,a,span{font-family:Segoe UI,Arial,sans-serif !important;}</style>
<![endif]-->
<style>
:root{color-scheme:light dark;supported-color-schemes:light dark;}
body{margin:0;padding:0;width:100%!important;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
table{border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}
@media only screen and (max-width:620px){
  .fw-outer{padding:12px 8px!important;}
  .fw-wrap{width:100%!important;max-width:100%!important;}
  .fw-pad{padding-left:20px!important;padding-right:20px!important;}
  .fw-h1{font-size:24px!important;line-height:30px!important;}
  .fw-h2{font-size:22px!important;line-height:28px!important;}
}
@media (prefers-color-scheme: dark){
  .fw-page{background:#0b0f0d!important;}
  .fw-card{background:#141a17!important;border-color:#26302b!important;}
  .fw-soft{background:#101512!important;}
  .fw-ink{color:#eef3f0!important;}
  .fw-text{color:#c9d2cd!important;}
  .fw-muted{color:#8f9c96!important;}
  .fw-rule{border-color:#26302b!important;}
  .fw-accent{color:#34d399!important;}
  .fw-amber{color:#e3a94b!important;}
  .fw-amber-bar{border-color:#e3a94b!important;}
  .fw-chip{background:#1c2420!important;border-color:#2c3832!important;color:#c9d2cd!important;}
}
[data-ogsc] .fw-ink{color:#eef3f0!important;}
[data-ogsc] .fw-text{color:#c9d2cd!important;}
[data-ogsc] .fw-muted{color:#8f9c96!important;}
[data-ogsc] .fw-accent{color:#34d399!important;}
[data-ogsc] .fw-amber{color:#e3a94b!important;}
</style>
</head>
<body class="fw-page" style="margin:0;padding:0;background-color:#f4f6f5;">
<table role="presentation" class="fw-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6f5" style="width:100%;background-color:#f4f6f5;">
  <tr>
    <td class="fw-outer" align="center" style="padding:28px 12px;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->
      <table role="presentation" class="fw-wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin:0 auto;">
        <tr>
          <td>{{ message_content }}</td>
        </tr>
        <tr>
          <td class="fw-pad fw-muted" align="left" style="padding:20px 32px 8px 32px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#66706b;">
            You get this because you subscribed to Fresh Weights at <a href="https://freshweights.com" class="fw-muted" style="color:#66706b;text-decoration:underline;">freshweights.com</a>, the free AI launch radar.<br>
            <a href="{{ unsubscribe_url }}" class="fw-muted" style="color:#66706b;text-decoration:underline;">Unsubscribe</a> in one click, any time.
          </td>
        </tr>
        <tr>
          <td class="fw-pad fw-muted" align="left" style="padding:0 32px 24px 32px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#66706b;">{{ address }}</td>
        </tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
