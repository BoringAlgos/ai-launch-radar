<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<script>
(function () {
  var p = location.pathname.replace(/\/+$/, "").toLowerCase();
  var target = "/";
  if (p === "/ideas") target = "/#ideas";
  else if (p === "/archive") target = "/#archive";
  else if (p === "/live") target = "/#live";
  else if (p === "/spotlight") target = "/#spotlight";
  else if (p.indexOf("/weekly") === 0 || p.indexOf("/monthly") === 0) target = "/#subscribe";
  else {
    var m = p.match(/^\/(launch|idea)\/(.+)$/);
    if (m) target = "/#" + m[1] + "=" + encodeURIComponent(m[2]);
  }
  location.replace(target);
})();
</script>
</head>
<body style="margin:0;background:#0a0c0b;color:#f2f5f3;font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<p style="max-width:600px;margin:20vh auto 0;padding:0 20px">Redirecting… <a id="go" href="/" style="color:#3ddc97">Go to Fresh Weights</a></p>
</body>
</html>
